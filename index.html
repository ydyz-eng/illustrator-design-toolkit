<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI 设计工具箱</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- ── 顶部工具选择 ── -->
  <header class="tab-bar" id="tabBar">
    <!-- 由 JS 动态生成 -->
  </header>

  <!-- ── 工具内容区 ── -->
  <main class="content-area" id="contentArea">
    <!-- 由 JS 动态生成 -->
  </main>

  <!-- ── 底部状态栏 ── -->
  <footer class="status-bar">
    <div class="status-left" role="status" aria-live="polite" aria-atomic="true">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
    <button id="reloadBtn" class="reload-btn" type="button" title="重新加载面板和 JSX">↻ 重载插件</button>
  </footer>

  <script src="js/CSInterface.js"></script>
  <script src="js/dimension-poll.js"></script>
  <script src="js/dimension.js"></script>
  <script src="js/main.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
